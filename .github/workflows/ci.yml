name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonlight-db
    env:
      DATABASE_URL: mysql://u:p@127.0.0.1:3306/moonlight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4 # mínimo con los parches de seguridad del 21 oct 2026
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonlight-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4 # mínimo con los parches de seguridad del 21 oct 2026
      - run: npm ci --no-audit --no-fund
      - run: npm run check   # svelte-check + TypeScript
      - run: npm run build
