<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Moonlight · Personal</title>
  <meta name="theme-color" content="#07060e">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/fx.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/fx.js" defer></script>
  <script src="/js/staff.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/staff.html"><img class="logo-img isotipo" src="/img/isotipo.jpg" alt="" width="42" height="42">Moonlight <small class="muted small">· personal</small></a>
      <div style="flex:1"></div>
      <span class="reloj" id="reloj" aria-label="Hora actual"></span>
      <div class="userbox" id="userbox"></div>
    </div>
  </header>

  <main class="wrap">
    <section id="login" hidden>
      <div class="card pad-lg login-box">
        <img class="logo-img" src="/img/logo.jpg" alt="Moonlight Karaoke &amp; Social Lounge" width="1000" height="607">
        <h2>Acceso del personal</h2>
        <form id="form-login">
          <div class="field"><label for="l-email">Correo</label><input type="email" id="l-email" required autocomplete="username"></div>
          <div class="field"><label for="l-pw">Contraseña</label><input type="password" id="l-pw" required autocomplete="current-password">
            <label class="check mostrar-pw"><input type="checkbox" id="l-pw-ver"> Mostrar contraseña</label></div>
          <div class="err" id="login-err"></div>
          <button class="btn primary" type="submit" style="width:100%;justify-content:center">Entrar</button>
        </form>
        <p class="muted small" style="margin-top:16px"><a href="/">← Volver al sitio</a></p>
      </div>
    </section>

    <section id="panel" hidden>
      <nav class="tabs" id="tabs" aria-label="Secciones"></nav>

      <!-- RECEPCIÓN -->
      <div class="tab" id="tab-recepcion" hidden>
        <div class="layout-2">
          <div class="stack">
            <div class="card">
              <form id="form-buscar" class="row">
                <input id="b-codigo" placeholder="Número de reservación (ML…)" maxlength="10" autocomplete="off" style="flex:1;min-width:200px;text-transform:uppercase" required>
                <button class="btn primary" type="submit">Buscar</button>
                <button class="btn" type="button" id="btn-mostrador">+ Cliente sin registro</button>
              </form>
            </div>
            <div id="detalle"></div>
          </div>
          <aside class="card">
            <div class="row between"><h3 style="margin:0">Pedidos anticipados por cobrar</h3><button class="btn sm ghost" id="btn-por-cobrar" type="button">↻</button></div>
            <p class="muted small">El cliente pagó el anticipo en línea; cobra el resto al llegar.</p>
            <div id="por-cobrar"></div>
          </aside>
        </div>
      </div>

      <!-- AGENDA -->
      <div class="tab" id="tab-agenda" hidden>
        <div class="row between">
          <h2>Agenda</h2>
          <div class="row"><input type="date" id="ag-fecha" aria-label="Fecha"><button class="btn" type="button" id="btn-agenda">Actualizar</button></div>
        </div>
        <div class="card table-wrap" id="agenda"></div>
      </div>

      <!-- BARRA -->
      <div class="tab" id="tab-barra" hidden>
        <figure class="banner-foto bajo"><img src="/img/lugar/bar.jpg" alt="Bar de Moonlight" width="1200" height="675" loading="lazy"></figure>
        <div class="row between"><h2>Pedidos en barra</h2><div class="row"><span class="vivo ok">En vivo</span><button class="btn sm" type="button" id="btn-sonido" aria-pressed="true">🔔 Sonido</button></div></div>
        <div class="grid cols-3" id="barra"></div>
      </div>

      <!-- SALAS -->
      <div class="tab" id="tab-salas" hidden>
        <div class="row between"><h2>Salas</h2><div class="row"><span class="vivo ok">En vivo</span><button class="btn sm" type="button" id="btn-salas">Actualizar</button></div></div>
        <div class="grid cols-4" id="salas"></div>
      </div>

      <!-- LIMPIEZA -->
      <div class="tab" id="tab-limpieza" hidden>
        <div class="row between"><h2>Limpieza</h2><span class="vivo ok">En vivo</span></div>
        <div class="grid cols-3" id="limpieza"></div>
      </div>

      <!-- FINANZAS -->
      <div class="tab" id="tab-finanzas" hidden>
        <div class="row between"><h2>Finanzas</h2><button class="btn sm" type="button" id="btn-kpis">Actualizar</button></div>
        <div id="kpis"></div>
      </div>
    </section>
  </main>
</body>
</html>
